    .continue { display: inline-block; margin-top: 1rem; color: #0d4a6b; text-decoration: none; font-weight: 600; font-size: 1rem; }

    @media(max-width:768px) { .header-wrap { flex-direction: column; text-align: center; } header { padding: .8rem 1rem; } nav { justify-content: center; gap: .25rem; } nav a { padding: .45rem .6rem; font-size: .9rem; } .container { padding: 1.25rem 1rem; } h1 { font-size: 1.8rem; } .cart-box { padding: .75rem; } .item { flex-direction: column; align-items: flex-start; padding: 1rem .5rem; } .item > div:last-child { width: 100%; justify-content: space-between; } .qty-ctrl { margin-top: .5rem; } .remove { margin-left: .5rem; } .total { font-size: 1.8rem; } }

<body>

  <header class="cc-header"><div class="cc-header-inner"><a class="cc-brand" href="index.html"><span class="cc-brandmark"><i class="fa-solid fa-microchip" aria-hidden="true"></i></span><span>CCTech IT Solutions<small>Technology, made dependable</small></span></a><button class="cc-menu" id="ccMobileMenu" type="button" aria-label="Open navigation" aria-expanded="false"><i class="fa-solid fa-bars" aria-hidden="true"></i></button><nav class="cc-nav" id="ccSiteNav" aria-label="Main navigation"><a href="index.html">Home</a><a href="sales-dynamic.html">Products</a><a href="service-dynamic.html">Services</a><a href="index.html#inspector">Windows tools</a><a href="amc.html">AMC plans</a><a href="reviews.html">Reviews</a><a href="cart.html">Cart <span class="cc-cart-count" id="cartCount" aria-label="Items in cart">0</span></a><a href="contact.html">Contact</a><a class="cc-nav-cta" href="https://wa.me/916364253615?text=Hi%20CCTech%20IT%20Solutions%2C%20I%20need%20help." target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i> Talk to an expert</a></nav></div></header>

  <div class="container">
    <h1><i class="fas fa-shopping-cart"></i> Your Shopping Cart</h1>
    <div class="cart-box" id="cartBox"></div>
  </div>

  <script>
    function readCart() { try { const value=JSON.parse(localStorage.getItem('cctech_cart')||'[]'); return Array.isArray(value) ? value.filter(item=>item&&Number.isFinite(Number(item.price))&&Number(item.price)>=0&&Number.isFinite(Number(item.qty))&&Number(item.qty)>0) : []; } catch { return []; } }
    let cart = readCart();
    function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    
    function renderCart() {
      const box = document.getElementById('cartBox');
      if(cart.length === 0) {
        box.innerHTML = `<div class="empty"><i class="fas fa-shopping-cart"></i><h2>Your cart is empty</h2><p>Add products from our sales page</p><a href="sales-dynamic.html" class="continue"><i class="fas fa-arrow-left"></i> Continue Shopping</a></div>`;
        return;
      }
      let total = 0, html = '';
      cart.forEach((item, index) => {
        const itemTotal = item.price * item.qty; total += itemTotal;
        html += `<div class="item"><div class="item-info"><h3>${escapeHtml(item.name || 'Product')}</h3><p>${escapeHtml(item.mainCategory || item.category || 'Product')} • ${escapeHtml(item.brand || 'Product')}</p><p>₹${Number(item.price).toLocaleString()} each</p><div class="price">Subtotal: ₹${itemTotal.toLocaleString()}</div></div><div style="display:flex; align-items:center; flex-wrap:wrap;"><div class="qty-ctrl"><button class="qty-btn" type="button" aria-label="Decrease ${escapeHtml(item.name)} quantity" onclick="changeQty(${index}, -1)">−</button><span class="qty-display">${Number(item.qty)}</span><button class="qty-btn" type="button" aria-label="Increase ${escapeHtml(item.name)} quantity" onclick="changeQty(${index}, 1)">+</button></div><button class="remove" type="button" onclick="removeItem(${index})"><i class="fas fa-trash"></i> Remove</button></div></div>`;
      });
      html += `<div class="total-section"><div class="total">Total: ₹${total.toLocaleString()}</div><button class="checkout-btn" onclick="location.href='checkout.html'"><i class="fas fa-credit-card"></i> Proceed to Checkout</button><a href="sales-dynamic.html" class="continue"><i class="fas fa-arrow-left"></i> Continue Shopping</a></div>`;
      box.innerHTML = html;
    }
    function changeQty(index, change) { if(!cart[index]) return; cart[index].qty = Number(cart[index].qty) + change; if(cart[index].qty <= 0) cart.splice(index, 1); localStorage.setItem('cctech_cart', JSON.stringify(cart)); renderCart(); }
    function removeItem(index) { cart.splice(index, 1); localStorage.setItem('cctech_cart', JSON.stringify(cart)); renderCart(); }
    renderCart();
  </script>
